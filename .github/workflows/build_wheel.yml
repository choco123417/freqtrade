name: Build Freqtrade Linux Wheel (with TA‑Lib)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y \
            build-essential python3.11-dev \
            libffi-dev libssl-dev libyaml-dev \
            wget tar

      - name: Build & install TA‑Lib from source
        run: |
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr/local
          make
          sudo make install
          cd ..

      - name: Install pip tools
        run: |
          python -m pip install --upgrade pip wheel build numpy setuptools

      - name: Install Python dependencies and Freqtrade
        run: |
          pip install ta-lib==0.5.5
          pip install -r requirements.txt
          pip install -e .

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: freqtrade-linux-wheel
          path: dist/*.whl
