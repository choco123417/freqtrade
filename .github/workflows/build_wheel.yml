name: Build Freqtrade Linux Wheel (with TA‑Lib)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential wget \
            libffi-dev libssl-dev libyaml-dev

      - name: Build and install TA‑Lib C library
        run: |
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
        env:
          TA_LIBRARY_PATH: /usr/lib
          TA_INCLUDE_PATH: /usr/include

      - name: Install pip tools
        run: |
          python -m pip install --upgrade pip wheel build numpy setuptools

      - name: Install Python dependencies and Freqtrade
        run: |
          pip install ta-lib
          pip install -r requirements.txt
          pip install -e .

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: freqtrade-linux-wheel
          path: dist/*.whl
